<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light only">
<title>출하사진 촬영</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:light;--mw:28rem;--ink:#3b4854;--brand:#00ab6b;--bg:#eef1f3;--card:#fff;--line:#cbd5e1;--mute:#64748b;--soft:#f1f5f9;--danger:#dc2626}
html,body{margin:0;-webkit-tap-highlight-color:transparent}
html{font-size:112.5%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;touch-action:manipulation;min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;user-select:none;-webkit-user-select:none}
header{background:var(--card);border-bottom:4px solid var(--brand);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.wrap{max-width:var(--mw);margin:0 auto;padding:0 1rem}
.hd{display:flex;align-items:center;justify-content:space-between;padding:.5rem 1.4rem}
.hd img{height:2.1rem;width:auto;background:#fff;border-radius:4px}
.sm{font-size:.875rem;font-weight:600;padding:.5rem .75rem;border-radius:.5rem;background:var(--soft);color:var(--mute)}
main{max-width:var(--mw);margin:0 auto;padding:.75rem 1rem 1.5rem}
.card{background:var(--card);border-radius:1rem;padding:1rem;box-shadow:0 1px 2px rgba(0,0,0,.06);margin-bottom:.7rem}
h1{font-size:1.5rem;font-weight:800;margin:0 0 .25rem}
.sub{font-size:.95rem;color:var(--mute);margin:0 0 .8rem}
.lb{font-size:.95rem;font-weight:700;margin:0 0 .4rem;display:block}
.in{width:100%;height:3.2rem;padding:0 .75rem;font-size:1.15rem;border-radius:.75rem;border:2px solid var(--line);background:var(--card);color:var(--ink);outline:none}
.in:focus{border-color:var(--brand)}
.row{display:flex;align-items:center;gap:.5rem}
.pre{font-size:1.05rem;font-weight:800;white-space:nowrap}
.pfb{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:.7rem}
.pf{height:3.4rem;border-radius:.75rem;font-size:1.05rem;font-weight:800;border:2px solid var(--line);color:var(--mute);background:var(--card)}
.pf.on{background:var(--brand);color:#fff;border-color:transparent}
.big{width:100%;height:3.6rem;border-radius:.75rem;background:var(--brand);color:#fff;font-size:1.15rem;font-weight:800}
.big:disabled,.mid:disabled{opacity:.4}
.mid{width:100%;height:3rem;border-radius:.75rem;font-weight:700;background:var(--card);border:2px solid var(--line)}
.mid.red{border-color:var(--danger);color:var(--danger)}
.meta{font-size:.9rem;color:var(--mute)}
.ok{color:var(--brand);font-weight:800}
.err{color:var(--danger);font-size:.9rem;font-weight:600;margin:.5rem 0 0}
.count{display:flex;align-items:center;justify-content:space-between}
.cn{font-size:1.3rem;font-weight:800}.cn b{color:var(--brand)}
.bar{height:.5rem;background:var(--soft);border-radius:9999px;overflow:hidden;margin-top:.55rem}
.bar i{display:block;height:100%;background:var(--brand)}
.vp{height:9.5rem;position:relative;background:var(--soft);border-radius:.75rem;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--mute);margin-bottom:.6rem}
.vp img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.cam{height:3.6rem;border-radius:.75rem;font-weight:800;font-size:1.05rem;color:#fff;background:var(--brand);box-shadow:0 4px 0 rgba(0,0,0,.2)}
.cam:active{transform:translateY(4px);box-shadow:none}
.cam.alt{background:#334155}
.sticky{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + .4rem);display:grid;gap:.5rem;padding:.3rem 0 .25rem;background:var(--bg);z-index:5}
.it{display:flex;gap:.7rem;align-items:center;padding:.6rem}
.it .imgs{display:flex;flex-wrap:wrap;gap:.2rem;margin-top:.3rem}.it img{width:2.6rem;height:2rem;object-fit:cover;border-radius:.25rem;background:var(--soft)}
.it .no{font-size:.8rem;color:var(--mute);font-weight:700}
.it .sn{font-size:1.05rem;font-weight:800;word-break:break-all}
.it .bt{display:flex;gap:.4rem;margin-top:.35rem}
.it .bt button{font-size:.85rem;font-weight:700;padding:.35rem .7rem;border-radius:.5rem;background:var(--soft)}
.it .bt .d{color:var(--danger)}
.ov{position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:1.5rem}
.dlg{background:var(--card);border-radius:1rem;padding:1.25rem;width:100%;max-width:24rem;box-shadow:0 20px 25px -5px rgba(0,0,0,.2)}
.dlg p{white-space:pre-line;font-weight:600;font-size:1.05rem;margin:0 0 1rem}
.dlg div{display:flex;gap:.5rem}
.dlg button{flex:1;height:3rem;border-radius:.75rem;font-weight:700;background:var(--soft)}
.dlg button.p{background:var(--brand);color:#fff}
@media (min-width:700px){:root{--mw:40rem}}
</style>
</head>

<script>
const NAME_KEY='ls_oqc_inspector_v1',DB='ls_mrk_photo_db',DBK='state',MAXN=20;
const PFX=['MRK00738AA KEA','MRK00737AA KEA'];
const LABELS=['S/N 바코드 라벨 촬영','UPS 케이블타이 확인','하단 왼쪽코너(물자국)','하단 오른쪽코너(물자국)','하단 가운데(물자국)','칠러 전원선 결선상태-1','칠러 전원선 결선상태-2','E Panel 전체사진(열린상태)','HVAC 왼쪽하단(본딩)','HVAC 오른쪽하단(본딩)','E-Panel 전체사진(닫힌상태)'];
const NP=LABELS.length,newPh=()=>Array(NP).fill(null);
let S={screen:'work',inspector:'',pfx:PFX[0],rest:'',photos:newPh(),items:[],edit:-1,saved:false};
let curSlot=0,warned=false,tmr=null;
function safeGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function safeSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
/* ---- 임시저장: 사진 50장을 담기 위해 IndexedDB 사용 ---- */
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function idbGet(k){const d=await idb();return new Promise((res,rej)=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function idbSet(k,v){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
function save(){clearTimeout(tmr);tmr=setTimeout(()=>{idbSet(DBK,S).catch(()=>{if(!warned){warned=true;tell('임시저장이 되지 않습니다.\n이 페이지를 닫지 말고 계속 진행해 주세요.')}})},250)}
async function load(){
  try{const o=await idbGet(DBK);if(o&&Array.isArray(o.items)&&Array.isArray(o.photos)&&o.photos.length===NP&&o.items.every(it=>it.photos&&it.photos.length===NP))S=Object.assign(S,o)}catch(e){}
  const n=safeGet(NAME_KEY);if(n&&!S.inspector)S.inspector=n;
  render();
}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const p2=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+' '+p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds());
const serial=()=>S.pfx+S.rest.trim();
const cleanRest=v=>{let t=String(v||'').toUpperCase().replace(/\s/g,'');if(t.startsWith(S.pfx))t=t.slice(S.pfx.length);return t.replace(/\D/g,'')};
function ask(msg,okText,cancelText){
  okText=okText||'확인';
  return new Promise(res=>{
    const d=document.createElement('div');d.className='ov';
    d.innerHTML='<div class="dlg"><p></p><div></div></div>';
    d.querySelector('p').textContent=msg;
    const row=d.querySelector('div div');
    const done=v=>{d.remove();res(v)};
    if(cancelText!==null){const c=document.createElement('button');c.textContent=cancelText||'취소';c.onclick=()=>done(false);row.appendChild(c)}
    const o=document.createElement('button');o.className='p';o.textContent=okText;o.onclick=()=>done(true);row.appendChild(o);
    document.body.appendChild(d);
  });
}
const tell=m=>ask(m,'확인',null);
function busy(msg){const d=document.createElement('div');d.className='ov';d.innerHTML='<div class="dlg"><p style="margin:0;text-align:center"></p></div>';d.querySelector('p').textContent=msg;document.body.appendChild(d);return()=>d.remove()}
function fileToPhoto(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      const M=800,r=Math.min(1,M/Math.max(img.naturalWidth,img.naturalHeight));
      const w=Math.round(img.naturalWidth*r),h=Math.round(img.naturalHeight*r);
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      res({data:c.toDataURL('image/jpeg',0.72),w,h});
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('load'))};
    img.src=url;
  });
}
function crc32(buf){
  if(!crc32.t){crc32.t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;crc32.t[n]=c>>>0}}
  let crc=0xFFFFFFFF;
  for(let i=0;i<buf.length;i++)crc=crc32.t[(crc^buf[i])&255]^(crc>>>8);
  return (crc^0xFFFFFFFF)>>>0;
}
function makeZip(files){
  const enc=new TextEncoder(),chunks=[],central=[];
  const u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];
  let offset=0;
  for(const f of files){
    const name=enc.encode(f.name),data=f.bin||enc.encode(f.text),crc=crc32(data),size=data.length;
    const lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(size),...u32(size),...u16(name.length),...u16(0)]);
    chunks.push(lh,name,data);central.push({name,crc,size,offset});offset+=lh.length+name.length+size;
  }
  const cdStart=offset;
  for(const c of central){
    const h=new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c.crc),...u32(c.size),...u32(c.size),...u16(c.name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(c.offset)]);
    chunks.push(h,c.name);offset+=h.length+c.name.length;
  }
  chunks.push(new Uint8Array([0x50,0x4b,5,6,0,0,0,0,...u16(central.length),...u16(central.length),...u32(offset-cdStart),...u32(cdStart),...u16(0)]));
  return new Blob(chunks,{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
const xe=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
function b64ToBytes(d){const b=atob(d.split(',')[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}

function render(){
  $('resetBtn').style.display=(S.items.length||S.rest||S.photos.some(Boolean))?'':'none';
  if(S.screen==='review')return renderReview();
  renderWork();
}
/* ---------- 촬영 화면 ---------- */
function renderWork(){
  const n=S.items.length,editing=S.edit>=0,full=!editing&&n>=MAXN,idx=editing?S.edit+1:n+1;
  $('app').innerHTML=`<section class="card">
    <label class="lb" for="insp">확인자 이름</label>
    <input id="insp" class="in" type="text" autocomplete="name" placeholder="예: 홍길동" value="${esc(S.inspector)}" oninput="S.inspector=this.value;safeSet(NAME_KEY,this.value);save()">
  </section>
  <section class="card">
    <div class="count"><div class="cn">${editing?'수정 중 ':''}<b>${full?MAXN:idx}</b> / ${MAXN}번째</div><div class="meta">촬영 완료 ${n}대 · 이번 건 ${S.photos.filter(Boolean).length}/${NP}</div></div>
    <div class="bar"><i style="width:${Math.round(n/MAXN*100)}%"></i></div>
  </section>
  ${full?`<section class="card"><div class="err" style="margin:0">최대 ${MAXN}대까지 촬영했습니다. 최종 완료를 눌러 엑셀을 저장하세요.</div></section>`:`
  <section class="card">
    <label class="lb">시리얼 번호 (접두사 선택 후 뒤 숫자 입력)</label>
    <div class="pfb">${PFX.map(p=>`<button class="pf ${p===S.pfx?'on':''}" onclick="setPfx('${p}')">${p}</button>`).join('')}</div>
    <div class="row"><span class="pre">${esc(S.pfx)}</span>
    <input id="rest" class="in" style="flex:1;min-width:0" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="숫자 입력" value="${esc(S.rest)}" oninput="S.rest=cleanRest(this.value);this.value=S.rest;save()"></div>
  </section>
  <section class="card"><label class="lb" style="margin:0">사진 ${S.photos.filter(Boolean).length} / ${NP}장 (모두 촬영해야 저장됩니다)</label></section>
  ${LABELS.map((nm,k)=>`<section class="card" id="slot${k}">
    <label class="lb">${k+1}. ${nm} ${S.photos[k]?'<span class="ok">✓</span>':''}</label>
    <div class="vp">${S.photos[k]?`<img src="${S.photos[k].data}" alt="">`:'사진 없음'}</div>
    <div class="two"><button class="cam" onclick="pickPhoto(${k},'fCam')">📷 ${S.photos[k]?'다시 촬영':'촬영'}</button><button class="cam alt" onclick="pickPhoto(${k},'fPick')">🖼 앨범</button></div>
  </section>`).join('')}
  ${editing||!(S.rest||S.photos.some(Boolean))?'':`<button class="mid red" style="margin-bottom:.7rem" onclick="clearCur()">이 건 입력 지우기</button>`}`}
  <div class="sticky">
    ${full?'':`<button class="big" onclick="nextItem()">${editing?'수정 저장':'저장하고 다음 (새 S/N)'}</button>`}
    ${editing?`<button class="mid" onclick="cancelEdit()">수정 취소</button>`:`<button class="mid" onclick="finish()">최종 완료 · 엑셀 저장 화면 (${n}대)</button>`}
  </div>
  <input id="fCam" type="file" accept="image/*" capture="environment" hidden onchange="addFile(this)">
  <input id="fPick" type="file" accept="image/*" hidden onchange="addFile(this)">`;
}
function pickPhoto(k,id){curSlot=k;$(id).click()}
function setPfx(v){S.pfx=v;S.rest=cleanRest(S.rest);save();render()}
async function addFile(inp){
  const f=inp.files&&inp.files[0];inp.value='';if(!f)return;
  const k=curSlot,done=busy('사진 처리 중...');
  try{S.photos[k]=await fileToPhoto(f)}catch(e){done();await tell('사진을 불러오지 못했습니다.');return}
  done();save();render();
  const nx=S.photos.findIndex((p,i)=>i>k&&!p),el=$('slot'+(nx>=0?nx:k));
  if(el)el.scrollIntoView({block:'center'});
}
function clearCur(){ask('입력 중인 S/N과 사진을 모두 지울까요?','지우기').then(ok=>{if(!ok)return;S.rest='';S.photos=newPh();save();render();window.scrollTo(0,0)})}
function checkCur(){
  if(!S.inspector.trim()){tell('확인자 이름을 입력해 주세요.').then(()=>{const e=$('insp');e&&e.focus()});return false}
  if(!S.rest.trim()){tell('시리얼 뒤 숫자를 입력해 주세요.').then(()=>{const e=$('rest');e&&e.focus()});return false}
  const miss=S.photos.map((p,i)=>p?'':(i+1)+'. '+LABELS[i]).filter(Boolean);
  if(miss.length){tell('누락된 사진이 있습니다. ('+miss.length+'장)\n\n'+miss.join('\n'));return false}
  return true;
}
const dup=()=>S.items.some((it,i)=>i!==S.edit&&it.pfx+it.rest===serial());
async function commit(){
  if(dup()&&!(await ask('이미 촬영한 S/N입니다.\n'+serial()+'\n\n그래도 저장할까요?','저장','수정')))return false;
  const it={pfx:S.pfx,rest:S.rest.trim(),photos:S.photos.map(p=>({data:p.data,w:p.w,h:p.h}))};
  if(S.edit>=0){S.items[S.edit]=it}else{S.items.push(it)}
  S.rest='';S.photos=newPh();S.saved=false;
  return true;
}
async function nextItem(){
  if(!checkCur())return;
  const wasEdit=S.edit>=0;
  if(!(await commit()))return;
  if(wasEdit){S.edit=-1;S.screen='review';save();render();window.scrollTo(0,0);return}
  save();
  if(S.items.length>=MAXN){await tell('최대 '+MAXN+'대까지 촬영했습니다.\n엑셀 저장 화면으로 이동합니다.');S.screen='review'}
  render();window.scrollTo(0,0);
  if(S.screen==='work'){const e=$('rest');e&&e.focus()}
}
async function finish(){
  if(S.rest.trim()||S.photos.some(Boolean)){
    const miss=S.photos.map((p,i)=>p?'':(i+1)+'. '+LABELS[i]).filter(Boolean);
    if(S.rest.trim()&&!miss.length){
      if(!S.inspector.trim()){await tell('확인자 이름을 입력해 주세요.');return}
      if(!(await ask('현재 입력 중인 S/N '+serial()+'\n아직 저장되지 않았습니다.\n\n저장하고 완료할까요?','저장 후 완료','취소')))return;
      if(!(await commit()))return;
    }else{
      await tell('입력 중인 항목이 완료되지 않아 최종 완료할 수 없습니다.\n'+(S.rest.trim()?'':'· S/N 미입력\n')+(miss.length?'· 누락 사진 '+miss.length+'장\n':'')+'\n모두 채우거나 "이 건 입력 지우기"를 눌러 주세요.');return;
    }
  }
  if(!S.items.length){await tell('촬영한 사진이 없습니다.');return}
  if(!S.inspector.trim()){await tell('확인자 이름을 입력해 주세요.');return}
  S.screen='review';save();render();window.scrollTo(0,0);
}
function cancelEdit(){S.edit=-1;S.rest='';S.photos=newPh();S.screen='review';save();render();window.scrollTo(0,0)}
/* ---------- 목록 확인 / 엑셀 저장 ---------- */
function renderReview(){
  const n=S.items.length;
  $('app').innerHTML=`<section class="card"><h1>촬영 목록</h1>
    <div class="meta">확인자 ${esc(S.inspector)}</div>
    <div class="${n?'ok':'err'}" style="margin-top:.3rem">총 ${n}대 / 최대 ${MAXN}대${S.saved?' · 저장됨':''}</div></section>
  ${S.items.map((it,i)=>`<section class="card it"><div style="flex:1;min-width:0"><div class="no">${i+1}번째 · 사진 ${it.photos.length}장</div><div class="sn">${esc(it.pfx+it.rest)}</div>
    <div class="imgs">${it.photos.map(p=>`<img src="${p.data}" alt="">`).join('')}</div>
    <div class="bt"><button onclick="editItem(${i})">수정</button><button class="d" onclick="delItem(${i})">삭제</button></div></div></section>`).join('')}
  <div class="sticky">
    <button class="big" onclick="downloadXlsx()" ${n?'':'disabled'}>엑셀(.xlsx) 저장${S.saved?' (다시 저장)':''}</button>
    ${n<MAXN?`<button class="mid" onclick="backWork()">촬영 화면으로 돌아가기${n?' (추가 촬영)':''}</button>`:''}
    ${S.saved?`<button class="mid red" onclick="resetAll(true)">새로 시작</button>`:''}
  </div>`;
}
function backWork(){S.screen='work';S.edit=-1;save();render();window.scrollTo(0,0)}
function editItem(i){
  if((S.rest.trim()||S.photos.some(Boolean))&&S.edit<0){tell('입력 중이던 항목은 지워지고 선택한 항목을 수정합니다.')}
  const it=S.items[i];S.edit=i;S.pfx=it.pfx;S.rest=it.rest;S.photos=it.photos.map(p=>({data:p.data,w:p.w,h:p.h}));S.screen='work';save();render();window.scrollTo(0,0);
}
async function delItem(i){
  if(!(await ask(S.items[i].pfx+S.items[i].rest+' 항목을 삭제할까요?','삭제')))return;
  S.items.splice(i,1);S.saved=false;save();renderReview();
}
async function resetAll(skip){
  if(skip!==true&&!(await ask('촬영한 모든 사진과 S/N을 지우고 처음으로 돌아갈까요?\n엑셀로 저장하지 않은 데이터는 사라집니다.','처음으로')))return;
  S={screen:'work',inspector:S.inspector,pfx:S.pfx,rest:'',photos:newPh(),items:[],edit:-1,saved:false};
  save();render();window.scrollTo(0,0);
}
/* ---------- 엑셀: S/N + 사진만 ---------- */
const ROWPT=130,ROWPX=173,COLB_PX=229,BOX_W=217,BOX_H=163,FIRST=4,colL=i=>String.fromCharCode(65+i);
const cell=(ref,s,t)=>`<c r="${ref}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${xe(t)}</t></is></c>`;
function stylesXml(){
  const bd='<border><left style="thin"><color rgb="FF000000"/></left><right style="thin"><color rgb="FF000000"/></right><top style="thin"><color rgb="FF000000"/></top><bottom style="thin"><color rgb="FF000000"/></bottom><diagonal/></border>';
  const fo=(b,sz)=>`<font>${b?'<b/>':''}<sz val="${sz}"/><name val="맑은 고딕"/></font>`;
  const xf=(f,fi,b,al)=>`<xf numFmtId="0" fontId="${f}" fillId="${fi}" borderId="${b}" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment ${al}/></xf>`;
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
  '<fonts count="3">'+fo(0,10)+fo(1,11)+fo(1,16)+'</fonts>'+
  '<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFD9D9D9"/><bgColor indexed="64"/></patternFill></fill></fills>'+
  '<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border>'+bd+'</borders>'+
  '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'+
  '<cellXfs count="5"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'+
  xf(1,2,1,'horizontal="center" vertical="center" wrapText="1"')+xf(2,0,0,'horizontal="center" vertical="center"')+
  xf(1,0,1,'horizontal="center" vertical="center" wrapText="1"')+xf(0,0,0,'horizontal="left" vertical="center"')+
  '</cellXfs></styleSheet>';
}
function sheetXml(){
  const R={},ht={1:36,2:22,3:48},add=(r,x)=>{R[r]=(R[r]||'')+x},LC=colL(NP);
  const empt=(r,s)=>Array.from({length:NP},(_,i)=>`<c r="${colL(i+1)}${r}" s="${s}"/>`).join('');
  add(1,cell('A1',2,'SLE 칠북 공장 - 출하사진')+empt(1,2));
  add(2,cell('A2',4,'확인자 : '+S.inspector.trim()+'      저장일시 : '+S.endTxt)+empt(2,4));
  add(3,cell('A3',1,'S/N')+LABELS.map((nm,i)=>cell(colL(i+1)+'3',1,(i+1)+'. '+nm)).join(''));
  S.items.forEach((it,i)=>{const r=FIRST+i;ht[r]=ROWPT;add(r,cell('A'+r,3,it.pfx+it.rest)+empt(r,3))});
  const rows=Object.keys(R).map(Number).sort((a,b)=>a-b).map(r=>`<row r="${r}" ht="${ht[r]}" customHeight="1">${R[r]}</row>`).join('');
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheetViews><sheetView workbookViewId="0"><pane xSplit="1" ySplit="3" topLeftCell="B4" activePane="bottomRight" state="frozen"/></sheetView></sheetViews><cols><col min="1" max="1" width="26" customWidth="1"/><col min="2" max="'+(NP+1)+'" width="32" customWidth="1"/></cols><sheetData>'+rows+'</sheetData><mergeCells count="2"><mergeCell ref="A1:'+LC+'1"/><mergeCell ref="A2:'+LC+'2"/></mergeCells><drawing r:id="rId1"/></worksheet>';
}
function drawingXml(){
  const E=9525;let a='',n=0;
  S.items.forEach((it,i)=>{it.photos.forEach((p,c)=>{
    if(!p)return;n++;
    const k=Math.min(BOX_W/p.w,BOX_H/p.h),w=Math.round(p.w*k),h=Math.round(p.h*k),ox=Math.round((COLB_PX-w)/2)*E,oy=Math.max(0,Math.round((ROWPX-h)/2))*E,r=FIRST-1+i,cx=w*E,cy=h*E;
    a+=`<xdr:oneCellAnchor><xdr:from><xdr:col>${1+c}</xdr:col><xdr:colOff>${ox}</xdr:colOff><xdr:row>${r}</xdr:row><xdr:rowOff>${oy}</xdr:rowOff></xdr:from><xdr:ext cx="${cx}" cy="${cy}"/><xdr:pic><xdr:nvPicPr><xdr:cNvPr id="${n+1}" name="사진 ${i+1}-${c+1}"/><xdr:cNvPicPr><a:picLocks noChangeAspect="1"/></xdr:cNvPicPr></xdr:nvPicPr><xdr:blipFill><a:blip r:embed="rId${n}"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill><xdr:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr></xdr:pic><xdr:clientData/></xdr:oneCellAnchor>`;
  })});
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'+a+'</xdr:wsDr>';
}
const ALLP=()=>S.items.flatMap(it=>it.photos.filter(Boolean));
function buildXlsxBlob(){
  const H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n',R='http://schemas.openxmlformats.org/officeDocument/2006/relationships',PK='http://schemas.openxmlformats.org/package/2006/relationships',SM='application/vnd.openxmlformats-officedocument.spreadsheetml';
  const files=[
    {name:'[Content_Types].xml',text:H+`<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="jpeg" ContentType="image/jpeg"/><Override PartName="/xl/workbook.xml" ContentType="${SM}.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="${SM}.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="${SM}.styles+xml"/><Override PartName="/xl/drawings/drawing1.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/></Types>`},
    {name:'_rels/.rels',text:H+`<Relationships xmlns="${PK}"><Relationship Id="rId1" Type="${R}/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
    {name:'xl/workbook.xml',text:H+`<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="${R}"><sheets><sheet name="출하사진" sheetId="1" r:id="rId1"/></sheets></workbook>`},
    {name:'xl/_rels/workbook.xml.rels',text:H+`<Relationships xmlns="${PK}"><Relationship Id="rId1" Type="${R}/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="${R}/styles" Target="styles.xml"/></Relationships>`},
    {name:'xl/styles.xml',text:stylesXml()},
    {name:'xl/worksheets/sheet1.xml',text:sheetXml()},
    {name:'xl/worksheets/_rels/sheet1.xml.rels',text:H+`<Relationships xmlns="${PK}"><Relationship Id="rId1" Type="${R}/drawing" Target="../drawings/drawing1.xml"/></Relationships>`},
    {name:'xl/drawings/drawing1.xml',text:drawingXml()},
    {name:'xl/drawings/_rels/drawing1.xml.rels',text:H+`<Relationships xmlns="${PK}">`+ALLP().map((p,i)=>`<Relationship Id="rId${i+1}" Type="${R}/image" Target="../media/image${i+1}.jpeg"/>`).join('')+'</Relationships>'}
  ];
  ALLP().forEach((p,i)=>files.push({name:`xl/media/image${i+1}.jpeg`,bin:b64ToBytes(p.data)}));
  return makeZip(files);
}
function downloadXlsx(){
  if(!S.items.length)return;
  if(!S.inspector.trim()){tell('확인자 이름을 입력해 주세요.');return}
  const d=new Date();S.endTxt=fmt(d);S.saved=true;save();
  const name='출하사진_'+d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+'_'+p2(d.getHours())+p2(d.getMinutes())+'_'+S.items.length+'대.xlsx';
  const a=document.createElement('a');
  a.href=URL.createObjectURL(buildXlsxBlob());a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  renderReview();
}
render();load();
</script>
</body>
</html>
